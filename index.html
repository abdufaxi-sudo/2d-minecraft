<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minecraft 2D Demo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-wrap">
      <div class="topbar">
        <div class="brand">Minecraft 2D</div>
        <div class="status">
          <span>Blocks: <strong id="blockCount">0</strong></span>
          <span>HP: <strong id="healthValue">100</strong></span>
        </div>
      </div>

      <canvas id="gameCanvas" width="960" height="640" aria-label="Minecraft inspired 2D game"></canvas>

      <div class="hud">
        <div class="inventory" id="inventory"></div>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
